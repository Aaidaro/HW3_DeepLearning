data:
  dataset1_root: data/dataset/dataset1
  dataset2_root: data/dataset/dataset2
  image_size:
  - 256
  - 256
  val_ratio: 0.1
  color_tolerance: 0
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
model:
  in_channels: 3
  base_channels: 64
  upsampling: bilinear
  use_skip: true
  batch_norm: false
  loss: cross_entropy
training:
  seed: 78
  epochs: 30
  batch_size: 4
  learning_rate: 0.001
  num_workers: 2
  pin_memory: true
  device: auto
  focal_gamma: 2.0
  focal_alpha: null
paths:
  results_dir: results
  saved_models_dir: models/saved_models
  summary_csv: results/segmentation_summary.csv
yolo:
  model: yolov8n.pt
  data: coco8.yaml
  epochs: 50
  freeze: 10
  imgsz: 640
  batch: 16
  name: coco8_yolov8n_freeze10
